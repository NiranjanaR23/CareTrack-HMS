{% extends 'hms_app/base.html' %}

{% block title %}Login — CareTrack HMS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center style='min-height: 80vh;'">
  <div class="col-md-5 col-lg-4 mt-5">
    <div class="card shadow-lg border-0 p-4">
      <div class="text-center mb-4">
        <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center mb-2" style="width:60px; height:60px; font-size: 1.8rem;">
          <i class="bi bi-hospital"></i>
        </div>
        <h3 class="fw-bold mb-1">CareTrack HMS</h3>
        <p class="text-muted small">Hospital Management System Login</p>
      </div>

      {% if err %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          <i class="bi bi-exclamation-triangle me-2"></i> {{ err }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="admin" required value="admin">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required value="admin123">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <div class="text-center mt-4 small text-muted">
        Default Demo Credentials: <code>admin</code> / <code>admin123</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}
